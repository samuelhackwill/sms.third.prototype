name: Phone Wall
on: [push, pull_request]
jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix server/phone-wall
      - run: npm test --prefix server/phone-wall
      - run: npx playwright install --with-deps firefox
        working-directory: server/phone-wall
      - run: npm run test:ui --prefix server/phone-wall
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ios/PhoneWall.xcodeproj -scheme PhoneWall -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/phone-wall-build CODE_SIGNING_ALLOWED=NO build
